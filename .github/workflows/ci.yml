name: CI

on:
  push:
    branches: [main, feat/core-features]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start API server
        run: |
          pnpm --filter @milvuslens/server exec tsx src/index.ts > /tmp/milvuslens-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3001/api/connections >/dev/null 2>&1; then
              echo "server ready"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3001/api/connections
          echo
          echo "--- server log ---"
          tail -n 40 /tmp/milvuslens-server.log || true

      - name: API smoke
        run: pnpm smoke
        env:
          API_BASE: http://127.0.0.1:3001
